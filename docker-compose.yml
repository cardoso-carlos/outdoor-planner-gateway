services:
  outdoor-planner-gateway:
    build: .
    ports: ["8000:8000"]
    environment:
      SECONDARY_API_URL: http://outdoor-planner-service:8001
    depends_on: [outdoor-planner-service]
  outdoor-planner-service:
    build: ../outdoor-planner-service
    ports: ["8001:8001"]
    environment:
      DATABASE_URL: sqlite:///./data/outdoor_planner.db
      WEATHER_API_BASE_URL: https://api.open-meteo.com
      HTTP_TIMEOUT_SECONDS: "10"
      # Placeholder local; always override with a random secret outside development.
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-this-in-real-environment-32}
      JWT_ALGORITHM: HS256
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: "60"
    volumes: [planner_data:/app/data]
volumes:
  planner_data:
